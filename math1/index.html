<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Math Note Test</title>
  <link rel="stylesheet" href="vendor/katex.min.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; font: 14px/1.45 "Segoe UI", sans-serif; color: #222; background: #f4f4f4; }
    .banner { display: flex; gap: 8px; align-items: center; padding: 8px 10px; background: #1f2933; color: #fff; }
    .banner label { font-size: 12px; opacity: .85; }
    .banner input, .banner select, .banner button { height: 28px; border: 0; border-radius: 4px; padding: 0 8px; font: inherit; }
    .banner select { min-width: 280px; }
    .banner .slot { flex: 1; opacity: .7; font-size: 12px; }
    .split { flex: 1; display: flex; min-height: 0; }
    .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fff; }
    .pane + .pane { border-left: 1px solid #d0d0d0; }
    .pane h2 { margin: 0; padding: 6px 10px; font-size: 12px; background: #eee; }
    textarea { flex: 1; border: 0; resize: none; padding: 10px; font: 14px/1.5 Consolas, monospace; }
    #render { flex: 1; overflow: auto; padding: 10px 14px; }
    #render p { margin: 0 0 8px; white-space: pre-wrap; }
    .katex { font-size: 1.05em; }
    @media print {
      body { display: block; background: #fff; }
      .banner, .pane:first-child { display: none !important; }
      .split, .pane, #render { display: block; height: auto; overflow: visible; }
      #render { padding: 0; }
    }
  </style>
</head>
<body>
  <header class="banner">
    <label>Title</label>
    <input id="title" type="text" placeholder="defaults to first line" />
    <button id="renderBtn" type="button">Render</button>
    <button id="save" type="button">Save</button>
    <button id="pdf" type="button">Export PDF</button>
    <select id="hist"><option value="">40 history</option></select>
    <span class="slot">banner slot</span>
  </header>
  <div class="split">
    <section class="pane">
      <h2>Paste</h2>
      <textarea id="src" placeholder="Paste text. Use $x^2$ or $$E=mc^2$$."></textarea>
    </section>
    <section class="pane">
      <h2>Render</h2>
      <div id="render"></div>
    </section>
  </div>
  <script src="vendor/katex.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
