<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Local File Explorer</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { font: 13px/1.35 "Segoe UI", Tahoma, sans-serif; background: #f0f0f0; color: #222; display: flex; flex-direction: column; }
  .toolbar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: #f3f3f3; border-bottom: 1px solid #c8c8c8; flex-wrap: wrap; }
  .toolbar input[type="search"] { flex: 1; min-width: 180px; height: 24px; border: 1px solid #adadad; padding: 0 8px; }
  .toolbar button { height: 24px; border: 1px solid #adadad; background: #e1e1e1; padding: 0 10px; font: inherit; cursor: pointer; }
  .toolbar button:hover { background: #eee; }
  .path { background: #fff; border: 1px solid #adadad; padding: 2px 8px; min-width: 160px; color: #444; }
  .listwrap { flex: 1; overflow: auto; background: #fff; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th { text-align: left; font-weight: 600; background: #f5f5f5; border-bottom: 1px solid #d0d0d0; padding: 5px 8px; position: sticky; top: 0; cursor: pointer; }
  tbody td { padding: 3px 8px; border-bottom: 1px solid #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  tbody tr:hover { background: #e5f3ff; }
  tbody tr.sel { background: #cce8ff; }
  .status { height: 22px; border-top: 1px solid #c8c8c8; background: #f3f3f3; padding: 3px 8px; color: #555; }
  .empty { padding: 24px; color: #777; }
</style>
</head>
<body>
<div class="toolbar">
  <input id="pathInput" type="text" placeholder="v:\downloads\*.mp4" style="width:280px;height:24px;border:1px solid #adadad;padding:0 6px;" />
  <button id="goBtn" type="button">List</button>
  <span class="path" id="rootPath">(no query)</span>
  <button id="prevBtn" type="button">Prev</button>
  <button id="nextBtn" type="button">Next</button>
  <input id="q" type="search" placeholder="Filter name or path..." />
  <button id="clearBtn" type="button">Clear</button>
  <button id="exportHtmlBtn" type="button">Export HTML</button>
  <button id="exportJsonBtn" type="button">Export JSON</button>
</div>
<div class="listwrap">
  <table>
    <thead>
      <tr>
        <th data-sort="name" style="width:28%">Name</th>
        <th data-sort="path" style="width:36%">Path</th>
        <th data-sort="size" style="width:10%">Size</th>
        <th data-sort="modified" style="width:16%">Modified</th>
        <th data-sort="type" style="width:10%">Type</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty">Enter an Everything query such as v:\downloads\*.mp4</div>
</div>
<div class="status" id="status">0 files</div>
<script src="explorer2.js"></script>
</body>
</html>
